name: Build and publish CLI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so two merges cannot race to publish the same version.
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: go test ./...
      - run: go vet ./...
      - run: npm test
      - name: Build Linux, macOS and Windows binaries (x64 and arm64)
        run: npm run build
      - name: Pack npm release
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Smoke test the installed package
        run: |
          npm install --global --prefix "$RUNNER_TEMP/mediacli-install" --ignore-scripts ./dist/*.tgz
          "$RUNNER_TEMP/mediacli-install/bin/mediacli" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check publishing configuration
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          OIDC_ENABLED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [[ -n "$NPM_TOKEN" || "$OIDC_ENABLED" == 'true' ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '### npm publishing is not configured' >> "$GITHUB_STEP_SUMMARY"
            echo 'The package is available in the npm-package artifact. See docs/npm-release.md to connect npm.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.auth.outputs.enabled == 'true'
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.auth.outputs.enabled == 'true'
        with:
          name: npm-package
          path: dist
      - name: Publish a new package version
        if: steps.auth.outputs.enabled == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.cjs
